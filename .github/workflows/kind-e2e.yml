name: Kind E2E

# The one gate that runs a Job on a real API server. Everything else about the
# chart is checked by rendering it (pre-commit's `helm lint`, test.yml's static
# composition sweep) — which can prove a manifest says the right thing and never
# that the cluster does the right thing with it.
#
# It asserts the four properties no render can reach: results outlive their pod
# (#428), an Indexed run fans out into <run-root>/<index>/ behind healthy sidecars
# (#18/#21), the deadline bounds one pod rather than the whole sweep, and the API
# server accepts the Job name minted for a per-task id carrying `_` (#372/#426).
#
# Two jobs, in parallel so neither pays for the other. `cluster-contract` stubs
# the runner and settles the chart's wiring; `real-eval` runs the genuine
# machinery — the real combination image, entrypoint and grader — over the two
# smallest artifacts in the fleet (benchmarks/agents-smoke + agents/mock) and
# checks that every file the dashboard later reads was actually written.
#
# cluster-contract is fast because it does not use the fleet's images: the agent, benchmark and
# gateway are megabytes-to-gigabytes of things this does not exercise, so the
# three containers are stood in for by ~4 MB busybox stubs satisfying exactly what
# the chart gates on. The chart itself, its volume wiring and its sidecar ordering
# are the real ones. Keep it that way — the moment this needs a real agent image
# it stops being a per-PR gate and belongs in nightly-*.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - containers/benchmarks/_chart/**
      - tests/e2e/**
      - .github/workflows/kind-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kind-e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cluster-contract:
    name: Chart contract (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      # kind, kubectl and helm; docker is already on the runner.
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: eval-e2e
          # The script creates and deletes its own cluster, so this step is here
          # only to install the binaries at a pinned version.
          install_only: true

      - name: Chart contract
        run: bash tests/e2e/cluster-contract.sh

  real-eval:
    name: Real eval (agents-smoke / mock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: eval-real
          install_only: true

      - name: Real eval
        run: bash tests/e2e/real-eval.sh
