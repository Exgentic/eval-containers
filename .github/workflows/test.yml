name: Tests

# The static gate: clippy + the daemon-free test suite + static composition
# (every benchmark's deploy artifact loads in all three run modes). Runs on
# every push and PR.
#
# Split of responsibilities with pre-commit.yml: the pre-commit hooks own the
# instant hygiene checks (fmt, hadolint, compose-schema, helm lint, secrets,
# …); this workflow owns everything heavier but still daemon-free — the
# compiler-based Rust gate and the per-mode "does the deploy artifact load"
# sweeps. So fmt is NOT repeated here.
#
# lint-and-test + static-composition are daemon-free (pure Rust/file I/O and
# parse/render-only sweeps). The third job, replay-e2e, is the ONE daemon-backed
# per-PR gate: a miniature of the nightly replay E2E (one fixture) that builds the
# images and stands up the real compose stack — the only check here that catches
# "the stack won't boot" (e.g. otelcol). The remaining container suites (build,
# live, gateways, agents, full replay/fleet) still run elsewhere (nightly-*.yml,
# release-images.yml on tag/main).
#
# Excluded on purpose:
#   - task_inspection::inspect_every_existing_fixture — an audit of recorded
#     sample-trajectory data quality (refusals on safety benchmarks, file
#     delegation on long-context benchmarks are working-as-designed and there
#     is no label to distinguish them). It checks fixtures, not PR soundness,
#     so it is not a per-PR gate. Its rule UNIT tests still run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read # replay-e2e pulls GHCR base images during the build

concurrency:
  # One group per PR/branch so a new push cancels in-flight runs (every job only
  # evaluates the latest commit).
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: clippy + daemon-free tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Lint exactly the daemon-free surface this gate builds: the shipping CLI
      # crate (lib + bins + cli_conformance) and the static-stage gate crate
      # (check / dockerfile_inspection / task_inspection). Scoping by package
      # keeps the testcontainers/tokio/reqwest stack — declared only by the
      # build/run crates, which are linted where they run — off this path.
      - name: cargo clippy -D warnings
        run: |
          cargo clippy \
            -p eval-containers \
            -p eval-containers-tests-static \
            --all-targets \
            -- -D warnings

      # Pure file I/O, no daemon. Dominated by the Rust compile (cached above).
      #   eval-containers              : naming + gen_bake unit tests (lib/bins)
      #                                  + cli_conformance (every benchmark/agent/
      #                                    model matches CLI naming)
      #   eval-containers-tests-static :
      #     - check            : triple-mode file presence, count reconciliation,
      #                          READMEs, + the bespoke repo-meta invariants
      #     - dockerfile_*     : the residual unpinned-pip/npm Dockerfile sweep
      #     - task_inspection  : trajectory rule UNIT tests (fixture audit skipped)
      #
      # The Dockerfile LABEL/pin/hygiene contract and the compose markers +
      # tag-axis rule moved to conftest for issue #114 — run by the
      # conftest-dockerfile / conftest-compose pre-commit hooks (pre-commit.yml).
      # compose schema validation is the check-compose-spec hook. The Rust helm
      # test became tests/static/helm.sweep.sh (run by Static composition below).
      - name: cargo test (daemon-free)
        run: |
          cargo test \
            -p eval-containers \
            -p eval-containers-tests-static \
            -- --skip inspect_every_existing_fixture

  # Static composition: every benchmark's deploy artifact must LOAD in all three
  # run modes. The pre-commit hooks do text/schema hygiene; this hands each
  # artifact to the REAL tool for its mode and fails if it won't load — the class
  # of bug text/schema checks miss (e.g. a compose include/extends merge conflict
  # Podman tolerates but Docker rejects). All daemon-free (parse/render only): no
  # images, no cluster. One job, one check; each mode is a step (sweep logic in
  # tests/static/):
  #   compose          → docker compose config              (compose.config.sweep.sh)
  #   single-container → conftest over process-compose.yaml (standalone.sweep.sh)
  #   k8s              → helm template + kubeconform + conftest (helm.sweep.sh)
  static-composition:
    name: Static composition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install helm
        uses: azure/setup-helm@v5

      # Pin a strict Compose: the "conflicts with imported resource" rule the
      # compose step catches is version-dependent — newer Compose merges the
      # override silently; v2.32.4 enforces it. conftest pinned to match the
      # pre-commit hooks; kubeconform validates the helm renders.
      - name: Install compose (pinned strict), conftest, kubeconform
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -sSLf -o ~/.docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-x86_64
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
          CONFTEST_VERSION=0.56.0
          curl -sSLf "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest
          curl -sSLf https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      # Each mode is its own step so the failing mode is obvious; `if: always()`
      # on the later steps runs all three even when an earlier one fails, so one
      # CI run surfaces every broken mode rather than just the first.
      - name: compose — docker compose config (every benchmark)
        run: tests/static/compose.config.sweep.sh

      - name: single-container — process-compose wiring
        if: ${{ !cancelled() }}
        run: tests/static/standalone.sweep.sh

      - name: k8s — helm render (every benchmark)
        if: ${{ !cancelled() }}
        run: tests/static/helm.sweep.sh

      - name: model paths — one shared gateway, model picked at runtime
        if: ${{ !cancelled() }}
        run: tests/static/model-paths.sweep.sh

      - name: fleet-hash graph == bake --print (both directions)
        if: ${{ !cancelled() }}
        run: tests/static/fleet-hash.sweep.sh

  # Per-PR gate: replay the components this PR actually changed. Affected =
  # diff of two fleet-hash runs (base SHA vs HEAD) — offline, as the PR gate
  # must be (verification RULES rule 1; #208), and base-image cascades come
  # free via the hash's bases component. Selection is machine-generated, so
  # zero matched tests is a FAILURE, and affected components with no recorded
  # fixture are named in a ::warning (a visible coverage gap, never a quiet
  # pass). PRs touching nothing under containers/ exit in ~30s.
  affected:
    name: Test affected (changed components)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # the base SHA must be resolvable for REF=<base> fleet-hash

      - name: Select affected components
        id: sel
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: tests/select-affected.sh

      - name: Install Rust toolchain
        if: steps.sel.outputs.any == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        if: steps.sel.outputs.any == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: replay

      - name: Log in to GHCR
        if: steps.sel.outputs.any == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Replay the affected fixtures
        if: steps.sel.outputs.tests != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TESTS: ${{ steps.sel.outputs.tests }}
        run: |
          set -eo pipefail  # else `| tee` masks a failing cargo test
          # shellcheck disable=SC2086  # TESTS is a space-separated ident list
          cargo test -p eval-containers-tests-run --test replay \
            -- --ignored --nocapture --test-threads=1 --exact $TESTS \
            | tee replay.log
          if grep -qE "running 0 tests" replay.log; then
            echo "::error::machine-selected fixtures matched 0 tests: $TESTS"; exit 1
          fi

      # The changed agents' own suite. AGENTS_SMOKE_BUILD makes it build from
      # local source (the nightly path) — a PR's agent image does not exist in
      # the registry yet, which is exactly what we need to test.
      - name: Smoke the affected agents
        if: ${{ !cancelled() && steps.sel.outputs.agents != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AGENTS_SMOKE_BUILD: "1"
          IDS: ${{ steps.sel.outputs.agents }}
        run: |
          set -eo pipefail
          # shellcheck disable=SC2086  # IDS is a space-separated ident list
          cargo test -p eval-containers-tests-run --test agents \
            -- --ignored --nocapture --test-threads=1 --exact $IDS \
            | tee agents.log
          if grep -qE "running 0 tests" agents.log; then
            echo "::error::machine-selected agent smoke matched 0 tests: $IDS"; exit 1
          fi

      # The changed benchmarks' gold-solution check: the oracle must still score
      # 1.0, so a broken grader or a moved dataset fails the PR that broke it.
      # Per-task benchmarks are included — the suite covers each with one pinned
      # task. Coverage comes from the harness (ORACLE_LIST), never re-derived
      # here: a benchmark it deliberately cannot oracle (terminal-bench, whose
      # upstream gold drifted) warns instead of failing the PR.
      - name: Oracle the affected benchmarks
        if: ${{ !cancelled() && steps.sel.outputs.oracle != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CAND: ${{ steps.sel.outputs.oracle }}
        run: |
          set -eo pipefail
          # shellcheck disable=SC2086  # CAND is a space-separated name list
          only=$(tests/select-affected.sh oracle-filter $CAND | tee /dev/stderr | tail -1)
          [ -n "$only" ] || { echo "no covered benchmark to oracle"; exit 0; }
          ORACLE_ONLY="$only" cargo test -p eval-containers-tests-run --test oracle \
            -- --ignored --nocapture --test-threads=1 | tee oracle.log
          if grep -qE "running 0 tests" oracle.log; then
            echo "::error::oracle suite matched 0 tests for: $only"; exit 1
          fi

  # Per-PR gate: cheapest full-stack fixture (bigcodebench + zerostack) on the real
  # stack (otelcol → bifrost → runner), so a gateway/otelcol regression fails the PR.
  replay-e2e:
    name: Replay E2E (full-stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: replay

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Replay full-stack
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eo pipefail  # else `| tee` masks a failing cargo test
          # otel is a slow from-source build but a standalone sidecar — build it only
          # when this PR changes it (default), else pull the published base.
          bases="entrypoint agent-base-rust gosu model-replay"
          if [ -n "$PR" ] && files=$(gh pr diff "$PR" --name-only) \
             && ! grep -qE '^containers/core/otel/' <<<"$files"; then
            docker pull ghcr.io/exgentic/core/otel:latest
          else
            bases="$bases otel"
          fi
          export EVAL_BASES_OVERRIDE="$bases"
          cargo test -p eval-containers-tests-run --test replay \
            -- --ignored --nocapture --test-threads=1 replay_fullstack_bigcodebench_0_zerostack \
            | tee replay.log
          if grep -qE "running 0 tests" replay.log; then
            echo "::error::ran 0 tests — no 'replay_fullstack_bigcodebench_0_zerostack' fixture matched"; exit 1
          fi

      # Standalone bundle: the single-container path (core/standalone.Dockerfile
      # COPYs only /opt/gateway). Build the -standalone bundle and boot its gateway;
      # fails if the shim isn't self-contained under /opt/gateway (the #274 class).
      - name: Standalone gateway boots
        run: |
          set -eo pipefail
          cargo run -q -- build eval bigcodebench --agent zerostack --standalone 2>&1 | tail -3
          img=ghcr.io/exgentic/evals/bigcodebench--zerostack-standalone:latest
          # Boot smoke: EVAL_MODEL pins, upstream is a dead port — assert only that the gateway serves.
          cid=$(docker run -d -e EVAL_MODEL=x -e OPENAI_API_BASE=http://127.0.0.1:9 --entrypoint /opt/gateway/start "$img")
          deadline=$((SECONDS + 90))
          until docker exec "$cid" /opt/gateway/health >/dev/null 2>&1; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::standalone gateway never became healthy (shim not under /opt/gateway?)"; docker logs "$cid"; exit 1; }
            sleep 2
          done
          docker rm -f "$cid" >/dev/null
