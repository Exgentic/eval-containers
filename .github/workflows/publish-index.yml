name: Publish index

# THROWAWAY probe branch — combo build cost. Never merged.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  index:
    name: combo perf probe
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REG: localhost:5000
      A: ghcr.io/exgentic/agents/codex:latest
      B1: ghcr.io/exgentic/benchmarks/skills-bench-citation-check:latest
      B2: ghcr.io/exgentic/benchmarks/skills-bench-dialogue-parser:latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4
        with:
          # network=host so the builder container can reach the registry the job
          # starts on the host; http=true so it does not try TLS against it.
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: local registry (measure export+push without touching GHCR)
        run: |
          docker run -d -p 5000:5000 --name reg registry:2
          sleep 3

      - name: build one combo, current flags
        run: |
          build() { # $1=bench image  $2=tag  $3..=extra bake flags
            local b="$1" t="$2"; shift 2
            EVAL_BENCHMARK=probe EVAL_AGENT=codex BENCHMARK_IMAGE="$b" AGENT_IMAGE="$A" \
            docker buildx bake -f containers/docker-bake.hcl -f containers/core/combination.docker-bake.hcl \
              --set "eval.tags=${REG}/probe/${t}:t" --set "*.platform=linux/amd64" \
              --set "*.output=type=registry,registry.insecure=true" \
              "$@" eval
          }
          t0=$SECONDS; build "$B1" base1 --provenance=mode=max --sbom=true; echo "RESULT BASELINE_1 $((SECONDS-t0))s"
          t0=$SECONDS; build "$B2" base2 --provenance=mode=max --sbom=true; echo "RESULT BASELINE_2 $((SECONDS-t0))s"

      - name: patch COPY --link, drop sbom, rebuild the same two
        run: |
          # --link makes a COPY's layer independent of the base underneath it, so
          # the identical agent/edge/gosu bytes are compressed once and then reused
          # (and cross-repo mounted on push) instead of redone per combo.
          sed -i -E 's#^COPY --from=#COPY --link --from=#; s#^COPY runner/#COPY --link runner/#; s#^COPY entrypoint/#COPY --link entrypoint/#' containers/core/combination.Dockerfile
          grep -n "^COPY" containers/core/combination.Dockerfile
          build() {
            local b="$1" t="$2"; shift 2
            EVAL_BENCHMARK=probe EVAL_AGENT=codex BENCHMARK_IMAGE="$b" AGENT_IMAGE="$A" \
            docker buildx bake -f containers/docker-bake.hcl -f containers/core/combination.docker-bake.hcl \
              --set "eval.tags=${REG}/probe/${t}:t" --set "*.platform=linux/amd64" \
              --set "*.output=type=registry,registry.insecure=true" \
              "$@" eval
          }
          t0=$SECONDS; build "$B1" opt1 --provenance=mode=max --sbom=false; echo "RESULT OPT_1 $((SECONDS-t0))s"
          t0=$SECONDS; build "$B2" opt2 --provenance=mode=max --sbom=false; echo "RESULT OPT_2 $((SECONDS-t0))s"

      - name: prove no loss — identical contents, labels, entrypoint
        run: |
          fp() { # filesystem fingerprint of everything the combo adds
            docker run --rm --entrypoint sh "$1" -c \
              'find /opt/agent /opt/edge /usr/local/bin /etc/passwd -exec stat -c "%n %a %s %U:%G" {} + 2>/dev/null | sort | sha256sum'
          }
          meta() {
            docker inspect "$1" --format '{{json .Config.Labels}}{{.Config.Entrypoint}}{{.Config.Cmd}}{{.Config.User}}{{json .Config.Env}}'
          }
          for p in 1 2; do
            docker pull -q "${REG}/probe/base${p}:t"; docker pull -q "${REG}/probe/opt${p}:t"
            echo "=== combo $p"
            a=$(fp "${REG}/probe/base${p}:t"); b=$(fp "${REG}/probe/opt${p}:t")
            echo "  files baseline : $a"
            echo "  files optimised: $b"
            [ "$a" = "$b" ] && echo "  FILES-IDENTICAL" || { echo "  FILES-DIFFER"; exit 1; }
            ma=$(meta "${REG}/probe/base${p}:t"); mb=$(meta "${REG}/probe/opt${p}:t")
            [ "$ma" = "$mb" ] && echo "  METADATA-IDENTICAL" || { echo "  METADATA-DIFFER"; diff <(echo "$ma") <(echo "$mb") || true; exit 1; }
          done

      - name: what each image carries (attestations)
        run: |
          for t in base1 opt1; do
            echo "=== $t"
            docker buildx imagetools inspect "${REG}/probe/${t}:t" --raw 2>/dev/null \
              | jq -r '.manifests[]? | "\(.platform.os)/\(.platform.architecture) \(.annotations["vnd.docker.reference.type"] // "image")"'
          done
