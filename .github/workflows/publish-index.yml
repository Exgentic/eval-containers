name: Publish index

# THROWAWAY: replaced with a single terminal-bench task build. Not for merge.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  index:
    name: build qemu-alpine-ssh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: terminal-bench qemu-alpine-ssh
        run: |
          bash containers/benchmarks/terminal-bench/build.sh \
            ghcr.io/exgentic/benchmarks/terminal-bench-qemu-alpine-ssh:ci-probe qemu-alpine-ssh
          docker run --rm ghcr.io/exgentic/benchmarks/terminal-bench-qemu-alpine-ssh:ci-probe \
            sh -c 'qemu-system-x86_64 --version | head -1; cat /etc/os-release | grep PRETTY'
