name: Publish chart

# The continuous channel for `charts/eval`, split out of release-images.yml.
#
# It lived there as a job behind `needs: [release-gate]`, so `helm package` +
# `helm push` — seconds of work, no images involved — waited on a full fleet
# build. Consumers that render the published chart (the CLI's `--mode job`, the
# dashboard) were reading a chart hours behind main, which is the opposite of
# what a continuous channel is for.
#
# The versioned channel stays in release-images.yml: a release chart must not
# publish until the CVE gate has passed, and that gate is that pipeline's.
#
# A chart's OCI tag IS its SemVer (delivery/RULES.md:16), so there is no literal
# `:latest` — the continuous channel is Chart.yaml's version, republished on
# every push that changes the chart. A released version is immutable, so this
# refuses one whose GitHub Release is already out.

on:
  push:
    branches: [main]
    paths:
      - containers/benchmarks/_chart/**
      - .github/workflows/publish-chart.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Not cancel-in-progress: each push publishes the chart at its own commit, and
  # cancelling the one in flight to start a newer one only widens the window
  # where the registry holds neither.
  group: publish-chart

jobs:
  publish:
    name: charts/eval on the continuous channel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v5

      - uses: ./.github/actions/publish-chart
        with:
          registry: ghcr.io/${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          actor: ${{ github.actor }}
