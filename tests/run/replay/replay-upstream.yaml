# Full-stack replay overlay: add the recorded inference engine as the GATEWAY's
# upstream, so the real gateway + otelcol run on top of it (ReplayMode::FullStack
# in test.rs). Layered on top of the benchmark's compose.yaml AND the two opt-in
# overlays (compose/gateway.yaml, compose/otel.yaml) — this file only points the
# gateway at the replay engine; the overlays are what bring the gateway and the
# collector into the project at all (compose/RULES.md 8a).
#
# The gateway is pointed at this service purely via the `OPENAI_API_BASE` env the
# test sets (gateway.yaml already reads `${OPENAI_API_BASE:?}`) — no gateway
# override here. The one per-run value is REPLAY_FIXTURE (the recorded
# trajectory); results land where every run's do (runner.yaml).
services:
  upstream:
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/models/replay:latest
    # The real gateway enforces the streaming contract, so the upstream must
    # stream SSE when asked. Lean (replay as the edge's provider) does NOT set
    # this — it keeps the non-stream replies that path was verified against.
    environment:
      REPLAY_SSE: "1"
    # The distroless replay image has no shell; probe via the binary's own mode
    # (gateway.yaml's gateway uses /opt/gateway/health, a script this image lacks).
    healthcheck:
      test: ["CMD", "/opt/gateway/server", "health"]
      interval: 1s
      timeout: 1s
      retries: 30
    volumes:
      - ${REPLAY_FIXTURE:?}:/data/traces.jsonl:ro
    networks:
      - upstream

  # Wait for the upstream too (the gateway dials it lazily on the first request,
  # so gating only on the gateway races a 500). Merges with the existing deps.
  runner:
    depends_on:
      upstream:
        condition: service_healthy
