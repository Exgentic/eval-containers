include:
  - path: ../../compose/services.yaml

services:
  runner:
    extends:
      file: ../../compose/runner.yaml
      service: runner
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/evals/osworld2--${EVAL_AGENT:-claude-code}:latest
    environment:
      BENCHMARK: osworld2
      TIMEOUT: "3600"
      EVAL_TIMEOUT: "3600"
      DESKTOP_HOST: desktop
      DESKTOP_PORT: "5000"
    depends_on:
      otelcol:
        condition: service_healthy
      gateway:
        condition: service_healthy
      desktop:
        condition: service_healthy
    # A task's own setup downloads its assets from the public asset dataset,
    # and that download happens runner-side.
    networks:
      - internal
      - upstream
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # The same desktop image osworld builds — one per task, never shared.
  desktop:
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/core/osworld-desktop:${EVAL_TAG:-latest}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "2", "http://127.0.0.1:5000/platform"]
      interval: 2s
      timeout: 3s
      retries: 120
      start_period: 10s
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
