include:
  - path: ../../compose/services.yaml

services:
  # Native harness (benchmarks/RULES.md 12b): the launcher runs /harness.sh, no agent.
  runner:
    extends:
      file: ../../compose/runner-native.yaml
      service: runner
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/evals/walle--native:latest
    depends_on:
      otelcol:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      BENCHMARK: walle
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
