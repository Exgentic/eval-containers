include:
  - path: ../../compose/services.yaml

services:
  # Native harness (benchmarks/RULES.md 12b): the runner is evals/walle--native,
  # and the framework launcher runs /harness.sh — one POST of the case's schema
  # as response_format, scored 1.0 iff the observed accept/reject verdict matches
  # the expected one — in place of an agent. No user simulator, no sidecars.
  runner:
    extends:
      file: ../../compose/runner-native.yaml
      service: runner
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/evals/walle--native:latest
    depends_on:
      otelcol:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      BENCHMARK: walle
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
