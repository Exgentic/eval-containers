# AutomationBench — native harness (benchmarks/RULES.md 12b). No bespoke
# sidecars: the simulated SaaS tools are in-process, and there is no user
# simulator, so unlike tau-bench this needs no bridge / second gateway / extra
# Deployments. The agent axis is the benchmark's, not the run's: the runner is
# evals/automationbench--native and the shared launcher runs /harness.sh
# (auto-bench, graded in-process) in place of an agent.
agent: native
# A multi-step tool-calling loop — more wall-clock than the default.
timeout: '1800'
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 4Gi
