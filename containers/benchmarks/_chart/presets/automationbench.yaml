# AutomationBench — model-only, native harness. No bespoke sidecars: the
# simulated SaaS tools are in-process, and there is no user simulator, so unlike
# tau-bench this needs no bridge / second gateway / extra Deployments.
#
# The default runnerArgs run /entrypoint.sh /usr/local/bin/run (the scrubbed
# three-phase pipeline, which withholds the task id from the agent). This
# benchmark instead runs its own harness in the runner (which HAS the task id):
# materialize the task, run auto-bench (writes /logs/verifier/reward.txt), then
# write result.json via the shared writer.
timeout: '1800'
# Each step runs regardless of the previous one's exit status (run's
# `process_completed` semantics): write-result always grades whatever was
# produced, fail-closed to 0. run_automationbench.py resolves the task from
# /tasks/all.jsonl directly, so it does not depend on the materializer.
#
# Bypassing `run` means bypassing /usr/local/bin/run-agent, which is where the
# other two things a runner owes happen — so this sequence does them itself, the
# same way compose.yaml does:
#   - `timeout -k 30 "$TIMEOUT"` bounds the harness (rule 14). Without it the
#     preset's `timeout:` below reached the container as an env var nobody read,
#     and the only cap left was the pod's activeDeadlineSeconds — a SIGKILL that
#     lands before write-result can grade, so an over-budget task produced no
#     result at all instead of a graded 0. Exit 124 now says "timeout" out loud.
#   - `echo $?` records the harness's status in /output/agent/.exit-code, which
#     write-result copies into agent/result.json (rule 16). `|| true` swallowed
#     it, leaving exit_code permanently null for every task of this benchmark.
runnerArgs: >-
  /eval-materialize-task || true;
  timeout -k 30 "${TIMEOUT:-300}" python3 /app/run_automationbench.py;
  echo $? > /output/agent/.exit-code;
  /usr/local/bin/write-result;
  /usr/local/bin/reap-sidecars
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 4Gi
