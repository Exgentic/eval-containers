# OSWorld's bespoke topology: the agent needs a real desktop to drive.
#
# Upstream boots one per task as a QEMU VM from an 11 GB qcow2. No cluster we
# run on exposes /dev/kvm (no privileged SCC, no Kata runtime) and software
# emulation measures 5-24x slower, so the desktop runs as an ordinary container
# instead: same Ubuntu, same control API, native speed, no hostPath.
#
# It is a native sidecar, not a Deployment, because a desktop is per-task state.
# A shared one would have task B typing into task A's LibreOffice the moment the
# fan-out runs more than one task, and would outlive every run that used it.
# In the pod it is also one of the run's own containers: it shows up in the
# dashboard beside the runner, and it dies with the Job.
# Upstream's own Claude Code runner allows 23 hours a task
# (timeout_sec=82800 in hybrid_agents/claude_code/agent.py, with a 30-minute
# idle timeout) — these are long-horizon workflows, and an hour scores them
# as failures for running out of clock. Two hours is the compromise: enough
# for most of them, and it keeps the 68-task apps subset inside a day of
# cluster time. A score here is a lower bound on what the same agent would
# get under upstream's budget.
timeout: '7200'
# The pod's deadline covers everything, pulling included, and these images are
# big: 13.9 GB of runner (the gated assets) took 15 minutes to pull on a cold
# node, and task setup can spend ten more opening Chrome and Zotero. The
# default 600s grace left the CAD task killed mid-grade at 130 minutes, with
# no result written at all. Forty minutes covers a cold pull, setup, and the
# grader.
deadlineGrace: 2400
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 4Gi
runnerExtraEnv:
- name: DESKTOP_HOST
  value: localhost
- name: DESKTOP_PORT
  value: '5000'
initContainers:
# restartPolicy: Always makes this a native sidecar — started before the runner
# and kept running beside it. The startupProbe is what holds the runner back
# until X, the window manager and LibreOffice are actually up.
- name: desktop
  image: ghcr.io/exgentic/core/osworld-desktop:latest
  restartPolicy: Always
  volumeMounts:
  - name: desktop-sock
    mountPath: /run/desktop
  ports:
  - containerPort: 5000
  startupProbe:
    exec:
      command:
      - sh
      - -c
      - test -S /run/desktop/desktop.sock && curl -sf -m 2 -o /dev/null http://127.0.0.1:5000/screenshot
    periodSeconds: 3
    failureThreshold: 100
  resources:
    requests:
      cpu: '1'
      memory: 2Gi
    limits:
      cpu: '4'
      memory: 4Gi
extraVolumes:
- name: desktop-sock
  emptyDir: {}
runnerExtraVolumeMounts:
# Setup and grading open the socket here; the agent runs as uid 1002 and the
# socket is 0600 root, so the same path is useless to it.
- name: desktop-sock
  mountPath: /run/desktop
