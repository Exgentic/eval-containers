# DeepSWE v1.1 — long-horizon tasks, so the agent budget and the per-task
# resources both come from upstream's task.toml rather than the chart defaults.
#   [agent].timeout_sec        = 5400  -> upstream's budget; we allow MORE (see below)
#   [verifier].timeout_sec     = 1800  -> deadlineGrace (grading runs after the agent)
#   [environment].cpus/memory  = 2 / 8192 MiB -> resources.limits (rule 24e:
#                                must match compose.yaml's deploy.resources.limits)
# 14400 (4h), well above upstream's 5400. Measured, not guessed: at 7200 SEVEN of
# ten claude-code runs were killed at exactly the cap (exit 124) while still
# working — 203 and 120 model calls in flight at the kill. A too-small budget is
# silently indistinguishable from a wrong answer, because the launcher kills the
# agent and the verifier then grades a tree with no agent work (reward 0). The
# openclaw runs that finished cleanly took 4-35 min, so this ceiling costs nothing
# for faster agents; it only stops the slow ones being scored as failures.
# NOTE the preset WINS over `--set timeout=` (the chart mergeOverwrites the preset
# last), so this file is the only place the value can change.
timeout: '14400'
deadlineGrace: 1800
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 8Gi
