# DeepSWE v1.1 — long-horizon tasks, so the agent budget and the per-task
# resources both come from upstream's task.toml rather than the chart defaults.
#   [agent].timeout_sec        = 5400  -> upstream's budget; we allow MORE (see below)
#   [verifier].timeout_sec     = 1800  -> deadlineGrace (grading runs after the agent)
#   [environment].cpus/memory  = 2 / 8192 MiB -> resources.limits (rule 24e:
#                                must match compose.yaml's deploy.resources.limits)
# 7200 (2h) rather than upstream's 5400: these are long-horizon tasks and a
# too-small budget is silently indistinguishable from a wrong answer — the
# launcher kills the agent with exit 124 and the verifier then grades a tree with
# no agent work (reward 0). Note the preset WINS over `--set timeout=` (the chart
# mergeOverwrites the preset last), so this file is the only place to change it.
timeout: '7200'
deadlineGrace: 1800
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 8Gi
