# DeepSWE v1.1 — long-horizon tasks, so the agent budget and the per-task
# resources both come from upstream's task.toml rather than the chart defaults.
#   [agent].timeout_sec        = 5400  -> upstream's budget; we allow MORE (see below)
#   [verifier].timeout_sec     = 1800  -> deadlineGrace (grading runs after the agent)
#   [environment].cpus/memory  = 2 / 8192 MiB -> resources.limits (rule 24e:
#                                must match compose.yaml's deploy.resources.limits)
# 28800 (8h). Raised twice, each time on measurement rather than guesswork:
#   7200  -> 7 of 10 claude-code runs killed at the cap, still working
#   14400 -> 6 of 9 killed at the cap; the three that FINISHED took 112, 143.6 and
#            169.7 min, so the distribution's tail clearly runs past 4h
# A too-small budget is silently indistinguishable from a wrong answer: the launcher
# kills the agent and the verifier then grades a tree with no agent work (reward 0).
# The ceiling costs nothing for faster agents (openclaw's clean runs took 4-35 min);
# it only stops slow ones being scored as failures. Watch exit_code 124 in
# agent/result.json — if it reappears, raise this again rather than trusting a 0.
# NOTE the preset WINS over `--set timeout=` (the chart mergeOverwrites the preset
# last), so this file is the only place the value can change.
timeout: '28800'
deadlineGrace: 1800
# ephemeral-storage is NOT in compose (Docker has no such limit), so rule 24e
# parity is unaffected — it is a k8s-only concern. Without it every pod inherits
# the namespace LimitRange default of 4Gi, which is too small here: the upstream
# per-task base is ~880 MB and a task that builds its repo, installs deps and
# writes suite artifacts on top of that exceeds 4Gi. The pod is then EVICTED
# ("Container runner exceeded its local ephemeral storage limit"), which kills the
# gateway sidecar with exit 137 and looks like a crash rather than a disk limit.
# Observed on boa-hierarchical-evaluation-cancellation: evicted on both attempts.
resources:
  requests:
    cpu: 500m
    memory: 512Mi
    ephemeral-storage: 2Gi
  limits:
    cpu: '2'
    memory: 8Gi
    ephemeral-storage: 24Gi
