# Native harness (benchmarks/RULES.md 12b): the agent axis is the benchmark's.
agent: native
# 4 model calls of up to 300 s each; matches compose.yaml.
timeout: '1800'
# Rule 24e: matches compose.yaml's `deploy.resources.limits` (1 CPU / 1G).
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: '1'
    memory: 1Gi
