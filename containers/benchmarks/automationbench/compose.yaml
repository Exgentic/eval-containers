include:
  - path: ../../compose/services.yaml

services:
  # Model-only runner: AutomationBench's native harness runs one task
  # (EVAL_TASK_ID) and drives the model through the gateway. No bridge and no
  # user simulator — the harness is its own agent scaffold.
  runner:
    extends:
      file: ../../compose/runner.yaml
      service: runner
    depends_on:
      otelcol:
        condition: service_healthy
      gateway:
        condition: service_healthy
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/evals/automationbench--${EVAL_AGENT:-claude-code}:latest
    # Model-only: run the native harness directly (it needs the task id, which
    # the scrubbed agent phase withholds), then always write the result. Each
    # step runs regardless of the previous one's status — write-result grades
    # whatever was produced, fail-closed to 0 (mirrors /usr/local/bin/run).
    # There is no separate agent phase here, so run-agent never writes
    # /output/agent/.exit-code (rule 16) — capture the harness's own exit
    # status into it instead, so agent/result.json's exit_code reflects the
    # program that actually ran rather than staying permanently null.
    #
    # `. /usr/local/bin/start-edge` FIRST and unconditionally: overriding the
    # entrypoint also skips the edge bring-up that lives inside
    # /usr/local/bin/run, and without this the harness talks straight to the
    # gateway and every call goes unrecorded (.agents/edge/RULES.md rules 1, 6,
    # 10 — #558). Sourced, so its repointed OPENAI_BASE_URL (:4100) reaches the
    # harness. `|| exit 1`, not `|| true`: there is no `set -e` here, so a
    # sourced script's `return 1` is otherwise swallowed and an unrecorded run
    # would still score.
    entrypoint:
      - bash
      - -c
      - ". /usr/local/bin/start-edge || exit 1; /eval-materialize-task || true; python3 /app/run_automationbench.py; echo $? > /output/agent/.exit-code; /usr/local/bin/write-result"
    environment:
      BENCHMARK: automationbench
      # NOT what the harness reads: start-edge overwrites OPENAI_BASE_URL with
      # the edge's own :4100 before the harness runs, so this only ever reaches
      # the edge as its upstream (via the inherited OPENAI_API_BASE).
      OPENAI_BASE_URL: http://gateway:4000/openai/v1
      # Multi-step tool-calling loop — give it more wall-clock than the default.
      EVAL_TIMEOUT: ${EVAL_TIMEOUT:-1800}
      TIMEOUT: ${EVAL_TIMEOUT:-1800}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
