include:
  - path: ../../compose/services.yaml

services:
  # Native harness (benchmarks/RULES.md 12b): the launcher runs /harness.sh, no agent.
  runner:
    extends:
      file: ../../compose/runner-native.yaml
      service: runner
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/evals/automationbench--native:latest
    depends_on:
      otelcol:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      BENCHMARK: automationbench
      # Multi-step tool-calling loop — give it more wall-clock than the default.
      EVAL_TIMEOUT: ${EVAL_TIMEOUT:-1800}
      TIMEOUT: ${EVAL_TIMEOUT:-1800}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
