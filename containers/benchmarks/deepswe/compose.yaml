include:
  - path: ../../compose/services.yaml

services:
  runner:
    extends:
      file: ../../compose/runner.yaml
      service: runner
    depends_on:
      otelcol:
        condition: service_healthy
      gateway:
        condition: service_healthy
    # Per-task: the task id is part of the image name (rule 24f), so EVAL_TASK_ID
    # is required — there is no shared-env default to fall back to.
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/evals/deepswe-${EVAL_TASK_ID:?}--${EVAL_AGENT:-claude-code}:latest
    environment:
      BENCHMARK: deepswe
      # Upstream's [agent].timeout_sec (10800s on every task at the pinned ref),
      # matching the chart preset. Without this the runner's generic 300s default
      # applies and the agent is killed (exit 124) long before it can finish.
      EVAL_TIMEOUT: ${EVAL_TIMEOUT:-10800}
      TIMEOUT: ${EVAL_TIMEOUT:-10800}
    # Rule 10 / 24e — matches the chart's per-benchmark preset (2 CPU / 12Gi),
    # taken from each task.toml's [environment] cpus/memory_mb, with memory raised
    # from 8G to 12G after OOMs at it — a small step, not a measured size: see
    # presets/deepswe.yaml.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 12G
