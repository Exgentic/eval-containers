include:
  - path: ../../compose/services.yaml

services:
  runner:
    extends:
      file: ../../compose/runner.yaml
      service: runner
    depends_on:
      otelcol:
        condition: service_healthy
      gateway:
        condition: service_healthy
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/evals/cybergym-${EVAL_TASK_ID:?}--${EVAL_AGENT:-claude-code}:latest
    environment:
      BENCHMARK: cybergym
      EVAL_TIMEOUT: ${EVAL_TIMEOUT:-15000}
      TIMEOUT: ${EVAL_TIMEOUT:-15000}
    # Rule 10 / 24e — matches the chart preset.
    deploy:
      resources:
        limits:
          cpus: "2"
          # 4G: small step from the 2G default after OOMs; size TBD (#745)
          memory: 4G
