include:
  - path: ../../compose/services.yaml

services:
  runner:
    extends:
      file: ../../compose/runner.yaml
      service: runner
    depends_on:
      otelcol:
        condition: service_healthy
      gateway:
        condition: service_healthy
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/evals/cvdp-agentic--${EVAL_AGENT:-claude-code}:latest
    environment:
      BENCHMARK: cvdp-agentic
      # 1h agent budget; mirrored in _chart/presets/cvdp-agentic.yaml. Grading adds up to
      # 600 s per harness service (upstream's DOCKER_TIMEOUT).
      EVAL_TIMEOUT: ${EVAL_TIMEOUT:-3600}
      TIMEOUT: ${EVAL_TIMEOUT:-3600}
