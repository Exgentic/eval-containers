# Overlay: put the edge in the gateway slot.
#
#   docker compose -f containers/benchmarks/<b>/compose.yaml \
#                  -f containers/compose/edge.yaml up
#
# The slot keeps the service name `gateway` because every per-benchmark
# compose gates on it by name (`depends_on: gateway`) and the runner's
# base URLs point at `http://gateway:4000`; renaming it is a separate,
# mechanical change. What changes here is what fills the slot: one static
# binary that pins the model and records every call to /output/calls.jsonl
# (.agents/edge/RULES.md), instead of a proxy that does both differently.
#
# An override merges into the base service, so the upstream credential,
# OPENAI_API_BASE and EVAL_MODEL still come from services.yaml.
#
# Opt-in, not the default: the edge emits no OTel, so a run through this
# overlay produces calls.jsonl and no traces.jsonl. Set EDGE_UPSTREAM=gateway
# to keep a translating gateway behind it.
services:
  gateway:
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/core/edge:latest
    environment:
      OUT: /output/calls.jsonl
      EDGE_UPSTREAM: ${EDGE_UPSTREAM:-provider}
    healthcheck:
      test: ["CMD", "/opt/gateway/start", "health"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 1s
    volumes:
      - output:/output
