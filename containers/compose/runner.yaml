# Shared `runner` service template.
#
# Per-benchmark `compose.yaml` files pull this in with `extends:` (NOT
# `include:`): every benchmark must override the runner's image (to pin its
# self-describing `evals/<benchmark>--<agent>` artifact) and its `BENCHMARK`
# env, and Docker Compose forbids overriding a service that arrived through
# `include:` ("services.runner conflicts with imported resource"). `extends:`
# is the merge-friendly path — the benchmark file declares its own `runner`
# and grafts this template onto it. The networks still come from
# `services.yaml` via `include:`, since benchmarks never override those.
#
# IMPORTANT: `extends:` does NOT carry `depends_on` (Compose spec). A benchmark
# `compose.yaml` therefore redeclares whatever its own sidecars need — but never
# the gateway or the collector, which are absent from a default project
# (compose/RULES.md 8a). The opt-in overlays add both the service and the
# runner's `depends_on` for it.
services:
  runner:
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/evals/${EVAL_BENCHMARK:-aime}--${EVAL_AGENT:-claude-code}:latest
    environment:
      # Pass the runtime axes through as both EVAL_* (canonical — what
      # /entrypoint.sh and /usr/local/bin/run read) and bare names
      # (legacy — what process-compose.yaml + write-result read
      # internally). Until those internals migrate to EVAL_*, we set
      # both so the run is consistent regardless of which path produces
      # result.json.
      #
      # EVAL_BENCHMARK is deliberately NOT set as its own key: the benchmark is
      # fixed by the image (every benchmark Dockerfile bakes `ENV
      # EVAL_BENCHMARK=<name>`, and the eval image is `FROM` it), so it is not a
      # runtime axis like agent/task/model. `BENCHMARK` defaults to the same
      # axis only so this template renders standalone; every per-benchmark
      # `compose.yaml` overrides `BENCHMARK: <name>` with its own literal, which
      # is what keeps the per-benchmark `oci://…/eval-<benchmark>` artifact
      # self-describing without the consumer repeating the benchmark.
      EVAL_AGENT: ${EVAL_AGENT:-claude-code}
      # The handle the edge pins to (edge rule 2). MODEL below keeps the
      # human-readable label, which write-result prefers, so result.json is
      # unchanged.
      EVAL_MODEL: ${EVAL_MODEL}
      # The edge's upstream: the provider itself, and the credential for it.
      # Only the edge process ever sees the credential — run-edge passes it as a
      # scoped assignment, and the agent runs under its own uid with a scrubbed
      # env (`gosu agent env -i`), so it can neither inherit nor read it (edge
      # rule 14). Layering compose/gateway.yaml sets EVAL_GATEWAY_URL instead
      # and the credential stays on the gateway, as before.
      EVAL_UPSTREAM_API_BASE: ${OPENAI_API_BASE:?}
      EVAL_UPSTREAM_API_KEY: ${OPENAI_API_KEY:?}
      EVAL_TASK_ID: ${EVAL_TASK_ID:-0}
      EVAL_TIMEOUT: ${EVAL_TIMEOUT:-300}
      # EVAL_MODEL_SLUG names the model level: the CLI sets it, and a handle
      # cannot be used raw — `openai/gpt-5.4` would be two directories.
      # Set → rerun this task even if complete, emptying its directory first.
      EVAL_FORCE: ${EVAL_FORCE:-}
      # Optional; the agent's entrypoint applies it (empty → agent default).
      EVAL_AGENT_REASONING_EFFORT: ${EVAL_AGENT_REASONING_EFFORT:-}
      BENCHMARK: ${EVAL_BENCHMARK:-aime}
      AGENT: ${EVAL_AGENT:-claude-code}
      # Client-facing handle the agent actually sees (run-agent passes MODEL,
      # not EVAL_MODEL, through its scrubbed `env -i` allow-list). Some agents
      # (openhands) infer the wire API from it: a handle containing "gpt-5" or
      # "codex" forces the OpenAI Responses API onto EVERY model. Non-gpt-5
      # models (GLM, Kimi, …) truncate to `incomplete` on that path and stall
      # (task 44 GLM: 0.209 vs 0.845 on chat/completions). Keep the DEFAULT
      # neutral so every model takes the universal chat/completions path; set
      # EVAL_GATEWAY_LABEL to a "gpt-5*" string only to deliberately opt a
      # gpt-5-family model into the Responses API.
      MODEL: ${EVAL_GATEWAY_LABEL:-eval-model}
      TASK_ID: ${EVAL_TASK_ID:-0}
      TIMEOUT: ${EVAL_TIMEOUT:-300}
      # The agent talks to the edge, which start-edge brings up on 4100 inside
      # this container and re-exports these three to point at. They are set here
      # so `run` can tell lean mode from the single-container bundle, and so a
      # harness that reads them before sourcing start-edge sees the edge, never
      # a gateway that may not exist.
      ANTHROPIC_BASE_URL: http://127.0.0.1:4100/anthropic
      OPENAI_BASE_URL: http://127.0.0.1:4100/openai/v1
      GOOGLE_GEMINI_BASE_URL: http://127.0.0.1:4100/genai
      GEMINI_API_KEY: sk-proxy
      OPENAI_API_KEY: sk-proxy
      ANTHROPIC_API_KEY: sk-proxy
    # The task directory (rule 11); the otel overlay mounts its model/ half.
    volumes:
      - type: bind
        source: ${EVAL_OUTPUT_DIR:-${PWD}/output}/${EVAL_BENCHMARK:?}/${EVAL_AGENT:-claude-code}/${EVAL_MODEL_SLUG:-no-model}/${EVAL_RUN_ID:?name this run}/${EVAL_TASK_ID:-0}
        target: /output
        bind: { create_host_path: true }
    networks:
      - internal
    tmpfs:
      - /tmp:size=1G
      - /logs:size=100M
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
