# Shared compose topology that per-benchmark `compose.yaml` files pull in
# verbatim with `include:` — the parts no benchmark overrides: the `otelcol`
# and `gateway` services, the `internal`/`upstream` networks, and the `output`
# volume. The `runner` service is NOT here: every benchmark must override its
# image and `BENCHMARK` env, and Compose forbids overriding an `include:`d
# service, so the runner template lives in `runner.yaml` and is pulled via
# `extends:` instead. See `.agents/compose/RULES.md` rule 8.
services:
  otelcol:
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/core/otel:latest
    volumes:
      - output:/output
    # Probe otelcol's health_check endpoint (:13133) so the gateway can gate on
    # `service_healthy` below. Same per-orchestrator pattern as the gateway's
    # /opt/gateway/health check. Image is alpine-based, so busybox wget exists.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 1s
    networks:
      - internal

  gateway:
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/models/${EVAL_GATEWAY_IMAGE:-bifrost}:latest
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      OPENAI_API_BASE: ${OPENAI_API_BASE:?}
      # The model authority: a generic gateway pins to this handle. Unset ->
      # passthrough (client model); a pinned per-model image bakes its own.
      EVAL_MODEL: ${EVAL_MODEL}
      HOST: 0.0.0.0
      # Both gateway flavors emit OTel: bifrost via its native `otel`
      # plugin (collector_url derived from this in /opt/gateway/start),
      # litellm via the `otel` callback in config.yaml.template (reads
      # this env var directly). Spans land in /output/traces.jsonl via
      # the otelcol sidecar's file exporter.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
    healthcheck:
      test: ["CMD", "/opt/gateway/health"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s
    # condition: service_started (not service_healthy) so this costs no startup
    # latency — gateway and otelcol still boot in parallel, the runner gates on
    # both healthy (rule 8). The edge exists for STOP order: Compose stops
    # dependents before dependencies, so gateway (and its async OTel batch
    # exporter) is stopped before otelcol — without it, `docker compose up
    # --abort-on-container-exit` can stop both in parallel, otelcol's hostname
    # drops from Compose's embedded DNS, and the gateway's still-flushing final
    # span batch (typically the actual gen_ai completion span, emitted right as
    # the process winds down) fails with a DNS NameResolutionError and is lost.
    depends_on:
      otelcol:
        condition: service_started
    networks:
      - internal
      - upstream

networks:
  internal:
    internal: true
  upstream: {}

volumes:
  # Bind to the host so results land at ./output/{benchmark}/{task-id}/
  # (compose/RULES.md rule 18) instead of an anonymous managed volume with no
  # host-visible path. `${PWD}` resolves to the CLI's invocation directory,
  # not this file's directory, regardless of `include:` nesting.
  output:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/output/${EVAL_BENCHMARK:-aime}/${EVAL_TASK_ID:-0}
