# Shared compose topology that per-benchmark `compose.yaml` files pull in
# verbatim with `include:` — the parts no benchmark overrides: the
# `internal`/`upstream` networks and the `output` volume. There is no `gateway`
# and no `otelcol` service: the edge runs inside the runner and records every
# call itself (.agents/edge/RULES.md), and nothing emits OTel any more — the
# gateway was the only emitter, and agents never had the collector's endpoint
# in their scrubbed env.
#
# The `runner` service is NOT here: every benchmark must override its image and
# `BENCHMARK` env, and Compose forbids overriding an `include:`d
# service, so the runner template lives in `runner.yaml` and is pulled via
# `extends:` instead. See `.agents/compose/RULES.md` rule 8.
networks:
  internal:
    internal: true
  upstream: {}

volumes:
  output:
