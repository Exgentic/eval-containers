# Shared compose topology that per-benchmark `compose.yaml` files pull in
# verbatim with `include:` — the parts no benchmark overrides: the `internal`
# and `upstream` networks. The `runner` service is NOT here: every benchmark
# must override its image and `BENCHMARK` env, and Compose forbids overriding
# an `include:`d service, so the runner template lives in `runner.yaml` and is
# pulled via `extends:` instead. See `.agents/compose/RULES.md` rule 8.
#
# The `gateway` and `otelcol` services are NOT here either, and are not part of
# a default run (gateways/RULES.md 10-11, compose/RULES.md 8a). The edge inside
# the runner is the whole proxy path: it forwards to the provider in
# OPENAI_API_BASE and records every call verbatim. Ask for the extras by
# layering their overlay, which brings the service AND the runner wiring it
# needs, so one `-f` is the whole opt-in:
#
#   docker compose -f containers/benchmarks/<b>/compose.yaml \
#                  -f containers/compose/gateway.yaml up     # cross-wire translation
#   docker compose -f containers/benchmarks/<b>/compose.yaml \
#                  -f containers/compose/otel.yaml up        # gen_ai spans
networks:
  internal:
    internal: true
  upstream: {}
