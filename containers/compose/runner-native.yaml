# Shared `runner` template for a native-harness benchmark — one whose own
# harness is the agent (benchmarks/RULES.md 12b, agents/RULES.md 23).
#
# The agent axis is fixed by the benchmark, not chosen per run, so this pins it
# to `native` everywhere runner.yaml would read EVAL_AGENT: the eval image
# (`evals/<benchmark>--native`, the only one such a benchmark publishes), the
# agent the result records, and the task directory it writes to. Everything
# else — env contract, gateway URLs, tmpfs, limits — is runner.yaml's, pulled in
# with the same `extends:` chain a benchmark uses on this file.
services:
  runner:
    extends:
      file: runner.yaml
      service: runner
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/evals/${EVAL_BENCHMARK:-walle}--native:latest
    environment:
      EVAL_AGENT: native
      AGENT: native
    # Same shape as runner.yaml's mount with the agent segment pinned; compose
    # merges volumes by target, so this one replaces it.
    volumes:
      - type: bind
        source: ${EVAL_OUTPUT_DIR:-${PWD}/output}/${EVAL_BENCHMARK:?}/native/${EVAL_MODEL_SLUG:-no-model}/${EVAL_RUN_ID:?name this run}/${EVAL_TASK_ID:-0}
        target: /output
        bind: { create_host_path: true }
