worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    access_log off;
    proxy_http_version 1.1;
    proxy_buffering off;              # don't buffer streamed (SSE) responses
    proxy_set_header Connection "";
    client_max_body_size 100m;        # multimodal requests carry base64 images
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    upstream bifrost { server 127.0.0.1:4001; }

    # Bifrost can't see the inbound wire in a governance rule (no path/provider
    # CEL variable), so derive it from the path prefix and pass it in a header the
    # native-pin rules key on. Default to openai so an unprefixed request still
    # pins (fail-safe) rather than leaking the client's placeholder model.
    map $uri $eval_wire {
        ~^/anthropic/  anthropic;
        ~^/genai/      gemini;
        default        openai;
    }

    server {
        listen 4000;
        proxy_set_header X-Eval-Wire $eval_wire;   # overrides any client value
        location / { proxy_pass http://bifrost; }
    }
}
