# Single-container pipeline. Four processes by default:
#   edge → agent → verifier → result.
#
# `gateway` and `otelcol` are defined here too but are NOT started unless asked
# for: /usr/local/bin/run names the units to bring up, adding them when
# EVAL_WITH_GATEWAY / EVAL_WITH_OTEL are set (gateways/RULES.md 10-11). Nothing
# in the default path depends on either, so naming a subset is enough — a
# dependency on an unstarted process would fail the run, which is the same trap
# Compose profiles set and the reason no benchmark file may declare one.
#
# This is the SINGLE-CONTAINER mode only — the in-process orchestrator for the
# -standalone bundle, where the whole pipeline runs inside one container.
# It ships ONLY in core/standalone.Dockerfile; the lean eval base has neither
# process-compose nor this file. In compose / k8s the same units are separate
# services/pods, so /usr/local/bin/run runs the agent → verifier → result
# sequence directly there — no in-container supervisor.
#
# URL contract (resolved by /usr/local/bin/run BEFORE process-compose starts, so
# plain $VAR refs in commands work uniformly):
#   ANTHROPIC_BASE_URL  http://127.0.0.1:4000/anthropic
#   OPENAI_BASE_URL     http://127.0.0.1:4000/openai/v1
#
# The compose / k8s surfaces mirror the same units across separate
# services/containers — compose/services.yaml and benchmarks/_chart — with the
# same dependency edges: command:→image:, readiness_probe:→healthcheck:/probe,
# 127.0.0.1→service-name DNS / Pod loopback.

version: "0.5"

processes:
  otelcol:
    command: /usr/local/bin/otelcol --config=/etc/otelcol/config.yaml
    readiness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        port: 13133
        path: /
      initial_delay_seconds: 0
      period_seconds: 1
      timeout_seconds: 1
      failure_threshold: 30
    availability:
      restart: "no"
    log_location: /output/model/otelcol.log

  gateway:
    command: /opt/gateway/start
    readiness_probe:
      # Each gateway image bakes its own /opt/gateway/health that knows
      # the right path (bifrost: /api/health; litellm: /health/liveness).
      # exec keeps process-compose.yaml gateway-agnostic.
      exec:
        command: /opt/gateway/health
      initial_delay_seconds: 3
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 60
    # No depends_on otelcol: gateway/otelcol start in parallel; the agent waits
    # on both instead (mirrors compose). OTLP exporter retries until up.
    availability:
      restart: "no"
    log_location: /output/model/gateway.log

  # The agent talks to 4100 and the edge records every call
  # (.agents/edge/RULES.md). Its upstream is resolved by run-edge — the provider
  # by default, the in-process gateway when one was asked for — which is the
  # same script the compose/k8s path backgrounds, so both modes resolve it once.
  #
  # No depends_on gateway: the gateway may not be running at all, and when it is
  # the edge waits for it itself before reporting ready (EDGE_UPSTREAM_WAIT_
  # SECONDS), so this readiness probe still covers the whole path.
  edge:
    command: /usr/local/bin/run-edge
    readiness_probe:
      exec:
        command: /opt/edge/start health
      initial_delay_seconds: 0
      period_seconds: 1
      failure_threshold: 30
    availability:
      restart: "no"
    log_location: /output/model/edge.log

  agent:
    # The agent launch (non-root gosu, timeout, scrubbed env -i allow-list, raw
    # stdout/stderr redirection) lives in /usr/local/bin/run-agent — shared with
    # the lean base's runner sequence so rule 7's allow-list has one home.
    command: /usr/local/bin/run-agent
    depends_on:
      edge:
        condition: process_healthy
    availability:
      restart: "no"

  verifier:
    command: bash /grade.sh
    depends_on:
      agent:
        condition: process_completed
    availability:
      restart: "no"
    log_location: /output/task/verifier.log

  result:
    command: /usr/local/bin/write-result
    depends_on:
      verifier:
        condition: process_completed
    availability:
      restart: "no"
      # When the result writer finishes, process-compose exits — so the
      # whole container exits cleanly. Without this the long-running
      # daemons (the edge always, gateway/otelcol when asked for) would
      # keep the container alive forever.
      exit_on_end: true
    log_location: /output/task/result-writer.log
